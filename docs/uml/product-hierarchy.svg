<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="white"/><g font-family="monospace" font-size="15" fill="#142b42"><text x="600" y="30" text-anchor="middle" font-size="22">Tutorial 4 - Product inheritance hierarchy</text><rect x="350" y="60" width="500" height="311" fill="#f5f9ff" stroke="#142b42" stroke-width="2"/><text x="600.0" y="87" text-anchor="middle" font-weight="bold">Product</text><path d="M350,100 h500" stroke="#142b42"/><text x="362" y="123">- id : Long</text><text x="362" y="146">- name : String</text><text x="362" y="169">- price : double</text><path d="M350,179 h500" stroke="#142b42"/><text x="362" y="199">+ Product()</text><text x="362" y="222">+ Product(id, name, price)</text><text x="362" y="245">+ getId() : Long</text><text x="362" y="268">+ getName() : String</text><text x="362" y="291">+ getPrice() : double</text><text x="362" y="314">+ setId(id : Long) : void</text><text x="362" y="337">+ setName(name : String) : void</text><text x="362" y="360">+ setPrice(price : double) : void</text><rect x="25" y="460" width="550" height="265" fill="#f5f9ff" stroke="#142b42" stroke-width="2"/><text x="300.0" y="487" text-anchor="middle" font-weight="bold">DigitalProduct</text><path d="M25,500 h550" stroke="#142b42"/><text x="37" y="523">- downloadUrl : String</text><text x="37" y="546">- fileSizeMB : double</text><path d="M25,556 h550" stroke="#142b42"/><text x="37" y="576">+ DigitalProduct()</text><text x="37" y="599">+ DigitalProduct(id, name, price,</text><text x="37" y="622">                 downloadUrl, fileSizeMB)</text><text x="37" y="645">+ getDownloadUrl() : String</text><text x="37" y="668">+ getFileSizeMB() : double</text><text x="37" y="691">+ setDownloadUrl(url : String) : void</text><text x="37" y="714">+ setFileSizeMB(size : double) : void</text><path d="M300,460 V420 H480 V391" fill="none" stroke="#142b42" stroke-width="2"/><polygon points="480,371 469,391 491,391" fill="white" stroke="#142b42" stroke-width="2"/><rect x="625" y="460" width="550" height="265" fill="#f5f9ff" stroke="#142b42" stroke-width="2"/><text x="900.0" y="487" text-anchor="middle" font-weight="bold">PhysicalProduct</text><path d="M625,500 h550" stroke="#142b42"/><text x="637" y="523">- weightKg : double</text><text x="637" y="546">- dimensions : String</text><path d="M625,556 h550" stroke="#142b42"/><text x="637" y="576">+ PhysicalProduct()</text><text x="637" y="599">+ PhysicalProduct(id, name, price,</text><text x="637" y="622">                  weightKg, dimensions)</text><text x="637" y="645">+ getWeightKg() : double</text><text x="637" y="668">+ getDimensions() : String</text><text x="637" y="691">+ setWeightKg(weight : double) : void</text><text x="637" y="714">+ setDimensions(dimensions : String) : void</text><path d="M900,460 V420 H720 V391" fill="none" stroke="#142b42" stroke-width="2"/><polygon points="720,371 709,391 731,391" fill="white" stroke="#142b42" stroke-width="2"/></g></svg>